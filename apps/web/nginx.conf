# Sirve el build estático de React + proxea /api hacia el contenedor de la
# API (nombre de servicio `api` en docker-compose.yml, misma red default de
# compose) — mismo enrutamiento same-origin que ya hace el proxy de Vite en
# dev (apps/web/vite.config.ts).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker + `proxy_pass` con variable (no un host fijo):
    # con un host fijo, nginx resuelve UNA vez al arrancar y si en ese
    # instante el contenedor `api` todavía no tiene entrada DNS (arranca
    # después, o está reiniciando), nginx se niega a levantar del todo
    # ("host not found in upstream") — probado en esta misma máquina. Con la
    # variable, resuelve por request, tolera que `api` tarde o se reinicie.
    resolver 127.0.0.11 valid=10s;
    location /api {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fallback de SPA: una ruta de react-router-dom (ej. /microacciones)
    # no existe como archivo real — sin esto, refrescar la página en
    # cualquier ruta que no sea "/" da 404 de nginx en vez de servir
    # index.html y dejar que el router del lado del cliente la resuelva.
    location / {
        try_files $uri /index.html;
    }

    # index.html NUNCA se cachea: es el único archivo que referencia el hash
    # de los bundles de cada build (ver vite.config.ts — `assets/index-<hash>.js`).
    # Sin esto, nginx no manda ningún Cache-Control y el navegador aplica una
    # política heurística propia que a veces sirve un index.html viejo (con
    # hashes de un build anterior) en un refresh normal, sin ni siquiera
    # revalidar — pasó en esta misma app varias veces seguidas.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Los bundles SÍ llevan el hash de su contenido en el nombre de archivo:
    # un cambio de código siempre es un archivo nuevo, así que cachearlos
    # "para siempre" del lado del navegador es seguro y evita volver a
    # bajarlos en cada visita.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
